name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # `labeled` is added so that putting the `eval-full` label on a PR starts the
    # label-triggered full evaluation (eval-full-on-label below). It re-runs the
    # other jobs once per label event, which is an accepted cost.
    types: [opened, synchronize, reopened, labeled]

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repository (P1 review LOW-7).
permissions:
  contents: read

env:
  # Ephemeral, CI-only values. Never used outside a throwaway workflow run.
  SECRET_KEY: ci-only-secret-not-for-real-use
  POSTGRES_PASSWORD: ci-only-password
  APP_ENV: development
  CORS_ORIGINS: http://localhost:3000

jobs:
  lint-and-unit:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        # Ownership / sign-off / patient-scoping tests run against the real
        # migrated schema (tests/test_security_api.py, tests/test_pipelines.py).
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaidya
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vaidyaai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaidya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: vaidya
      POSTGRES_DB: vaidyaai
      # No network model downloads in unit tests — ML falls back to its
      # documented heuristics, which is what these tests exercise.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WHO_MULTIMODAL_STARTUP_INGEST: "false"
      # Fail (don't skip) the DB-backed suites if Postgres is missing.
      REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/ tools/

      - name: Every internal import resolves
        # A "dead code" cleanup once deleted app/image_pipeline/schemas.py while
        # it was still imported, and the Celery worker could not boot. Import
        # every task module the worker loads, plus the API app.
        run: |
          python -c "import app.main"
          python -c "from app.workers.celery_app import celery_app; celery_app.loader.import_default_modules(); print(sorted(t for t in celery_app.tasks if t.startswith('app.')))"

      - name: Migrate database
        run: alembic upgrade head

      - name: Fetch chest X-ray model weights
        # NIH classifier + chest X-ray autoencoder from torchxrayvision's GitHub
        # releases; lets the classifier and plausibility-gate
        # regression tests run against the real model instead of skipping.
        run: |
          python -c "import torchxrayvision as xrv; xrv.models.DenseNet(weights='densenet121-res224-nih')"
          python -c "import torchxrayvision as xrv; xrv.autoencoders.ResNetAE(weights='101-elastic')"

      - name: Unit tests with coverage
        # Runs the whole tests/ directory (minus the Docker-stack E2E suite)
        # so a new test file can't be silently left out of CI. Floor set just
        # under the measured 40%; raise it as coverage grows.
        run: |
          pytest tests/ --ignore=tests/test_e2e.py \
            -m "not integration" \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=38

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  bias-audit:
    name: Bias audit (informational)
    runs-on: ubuntu-latest
    # Never blocks the build — this is a domain-lead-review artifact, not a
    # pass/fail gate. Uses the same dependency install as lint-and-unit.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bias audit
        run: python -m app.ml.audit.run_bias_audit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bias-audit-report
          path: app/ml/audit/reports/

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest
    # Required to pass on main; allowed to fail without blocking a PR, since
    # the full stack (Celery workers, Groq, OCR models) can be slow/flaky in
    # a shared CI runner. It still runs on every PR so regressions are
    # visible, just not blocking.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - name: Write CI .env
        run: |
          cat > .env <<EOF
          APP_ENV=development
          SECRET_KEY=ci-only-secret-not-for-real-use
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_USER=vaidya
          POSTGRES_DB=vaidyaai
          CORS_ORIGINS=http://localhost:3000
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          EOF

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 5
          done
          echo "API never became healthy — dumping logs"
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test-only dependencies
        run: pip install pytest httpx

      - name: Run E2E suite
        run: pytest tests/test_e2e.py -v --tb=short

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  eval-gate:
    name: Eval gate (ratchet vs eval/baseline.json)
    runs-on: ubuntu-latest
    # Blocking, no `needs` (runs in parallel with lint-and-unit). Cold cache on
    # a 2-vCPU runner is about 20-22 min; warm OCR cache about 3 min.
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      WHO_MULTIMODAL_STARTUP_INGEST: "false"
      OCR_ENGINE: paddle
      # No GROQ_API_KEY, no services, no chest X-ray weights: the eval adapter
      # (tools/eval) only exercises lab-report extraction and the engine.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore eval corpus cache (test GT, native, csv)
        id: corpus-cache
        # Image renderings (scan/photo/rot90) are large and fast to regenerate,
        # so they are not cached.
        uses: actions/cache/restore@v4
        with:
          path: |
            eval/corpus/test/manifest.json
            eval/corpus/test/gt
            eval/corpus/test/native
            eval/corpus/test/csv
          key: eval-corpus-test-${{ hashFiles('tools/eval/**', 'requirements.txt') }}

      - name: Restore OCR cache (rolling)
        id: ocr-cache
        uses: actions/cache/restore@v4
        with:
          path: eval/.cache/ocr
          key: eval-ocr-${{ hashFiles('data/paddleocr/**', 'app/services/ocr_service.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            eval-ocr-${{ hashFiles('data/paddleocr/**', 'app/services/ocr_service.py', 'requirements.txt') }}-

      - name: Verify test corpus invariants
        run: python -m tools.eval.generate --verify --splits test

      - name: Run eval (CI profile, ratchet)
        # Exit codes: 0 pass; 1 gate failed (regression vs baseline); 2 harness
        # or config error (missing baseline/corpus, fingerprint mismatch);
        # 3 hygiene violation. Any non-zero code fails the job.
        run: |
          set +e
          make eval
          code=$?
          case "$code" in
            0) msg="eval gate passed" ;;
            1) msg="eval gate FAILED: metric regression vs eval/baseline.json" ;;
            2) msg="eval harness/config error (missing baseline or corpus, fingerprint mismatch, import failure)" ;;
            3) msg="eval hygiene violation (heldout)" ;;
            *) msg="eval exited with unexpected code $code" ;;
          esac
          echo "$msg (exit $code)"
          echo "### Eval gate: $msg (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-gate
          # `make eval` writes eval/runs/ci/; eval/metrics.json and eval/report.md hold the phase-end full run only
          path: |
            eval/runs/ci/metrics.json
            eval/runs/ci/report.md
          if-no-files-found: warn

      - name: Save eval corpus cache
        if: always() && steps.corpus-cache.outputs.cache-hit != 'true' && hashFiles('eval/corpus/test/manifest.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            eval/corpus/test/manifest.json
            eval/corpus/test/gt
            eval/corpus/test/native
            eval/corpus/test/csv
          key: eval-corpus-test-${{ hashFiles('tools/eval/**', 'requirements.txt') }}

      - name: Save OCR cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eval/.cache/ocr
          key: eval-ocr-${{ hashFiles('data/paddleocr/**', 'app/services/ocr_service.py', 'requirements.txt') }}-${{ github.run_id }}

  eval-full-on-label:
    name: Eval full (label eval-full)
    # The only way to run the full sharded evaluation before merge: `schedule`
    # fires only from the default branch, so it cannot cover an unmerged PR.
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'eval-full')
    uses: ./.github/workflows/eval-full.yml
